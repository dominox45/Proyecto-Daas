spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tp2}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  comisiones:
    cuenta-corriente: ${COMISION_CUENTA_CORRIENTE:5000.00}
    caja-ahorro: ${COMISION_CAJA_AHORRO:2000.00}
